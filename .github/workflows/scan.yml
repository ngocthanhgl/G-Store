name: catalog-scan

# Daily GitHub APK catalog scan (24h). Results are committed to catalog/
# and the Android app pulls catalog/apps.json on launch, so Home always
# has a list. Each run scans one rotating query set and MERGES into the
# previous catalog — coverage accumulates day over day. See tools/scan.py
# and docs/GITHUB_DISCOVERY.md for the documented coverage limits.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:
  push:
    paths:
      - tools/scan.py
      - .github/workflows/scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Run catalog scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_CHECK: 8000
          SCAN_DEADLINE_S: 18000 # 300 min soft deadline inside a 360 min job
        # The script always writes partial results + meta.json, even on
        # failure — the commit step must still run. But a nonzero exit with
        # NO catalog changes means nothing was written at all, which must be
        # red, not silently green. (set +e: the exit code is captured into
        # SCAN_EXIT instead of killing the step before the echo runs.)
        run: |
          set +e
          python3 tools/scan.py
          echo "SCAN_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Commit catalog
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/apps.json catalog/meta.json || true
          if git diff --cached --quiet; then
            echo "catalog unchanged"
            if [ "${SCAN_EXIT:-0}" != "0" ]; then
              echo "scan failed without writing any catalog output"
              exit 1
            fi
          else
            git commit -m "catalog: daily APK scan $(date -u +%F)" &&
            git push
          fi
