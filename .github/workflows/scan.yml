name: catalog-scan

# GitHub APK catalog scan every six hours (4 runs/day). Results are committed
# to catalog/ and the Android app pulls catalog/index.json (slim) on launch.
# Each run scans two rotating query sets and MERGES into the previous catalog.
# See tools/scan.py and docs/GITHUB_DISCOVERY.md for coverage limits.
on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours, UTC
  workflow_dispatch:

permissions:
  contents: write

# Overlapping runs race on `git push` and the loser goes red. Queue them:
# a second run waits instead of pushing over the first one.
concurrency:
  group: catalog-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Run catalog scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_CHECK: 8000
          SCAN_DEADLINE_S: 9000 # 150 min soft deadline inside a 180 min job
        # The script always writes partial results + meta.json, even on
        # failure — the commit step must still run. But a nonzero exit with
        # NO catalog changes means nothing was written at all, which must be
        # red, not silently green. (set +e: the exit code is captured into
        # SCAN_EXIT instead of killing the step before the echo runs.)
        run: |
          set +e
          python3 tools/scan.py
          echo "SCAN_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Commit catalog
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/apps.json catalog/index.json catalog/meta.json || true
          if git diff --cached --quiet; then
            echo "catalog unchanged"
            if [ "${SCAN_EXIT:-0}" != "0" ]; then
              echo "scan failed without writing any catalog output"
              exit 1
            fi
          else
            git commit -m "catalog: scheduled APK scan $(date -u +%F)" &&
            # A second scan run may have pushed first (concurrency queues
            # starts but each job checks out at start): rebase and retry
            # once instead of going red on a non-fast-forward push.
            (git push || (git pull --rebase origin main && git push))
          fi
