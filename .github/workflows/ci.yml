name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test catalog scanner
        run: python3 -m unittest discover -s tools -p "test_*.py"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default package list includes the long-removed `tools`
          # package and fails the step — install only what exists.
          packages: platform-tools

      - name: Install platform + build-tools 37
        run: |
          # Newest *versioned* cmdline-tools (the `latest` symlink lags) and
          # the exact platform spec — major-only `android-37` resolves on
          # new sdkmanager releases but not on the runner's snapshot.
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT/cmdline-tools/"[0-9]*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
