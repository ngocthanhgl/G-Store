name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default package list includes the long-removed `tools`
          # package and fails the step — install only what exists.
          packages: platform-tools

      - name: Install platform + build-tools 37
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT/cmdline-tools/"*/bin/sdkmanager | sort -V | tail -1)
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "--- installed platforms ---"
          "$SDKMANAGER" --list_installed | grep -i "platform" || true
          echo "--- remote API 35-37 platforms ---"
          "$SDKMANAGER" --list | grep -E "platforms;android-3[567]" || true
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
