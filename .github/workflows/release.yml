name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-apks:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default package list includes the long-removed `tools`
          # package and fails the step — install only what exists.
          packages: platform-tools

      - name: Install platform + build-tools 37
        run: |
          # Newest *versioned* cmdline-tools (the `latest` symlink lags) and
          # the exact platform spec — major-only `android-37` resolves on
          # new sdkmanager releases but not on the runner's snapshot.
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT/cmdline-tools/"[0-9]*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/gstore-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gstore-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release (arm + arm64)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List artifacts
        run: ls -la app/build/outputs/apk/release/

      - name: Publish GitHub Release with both APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(ls app/build/outputs/apk/release/*.apk | wc -l)" -eq 2
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" --generate-notes
